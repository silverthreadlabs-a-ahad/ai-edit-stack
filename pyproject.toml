[project]
name = "ai-edit-stack"
version = "1.0.0"
description = "Hands-off AI video editing with Claude Code + HyperFrames: analyze, select, score, preview, render on request."
requires-python = ">=3.11,<3.13"
dependencies = [
    "faster-whisper>=1.1.0",
    "scenedetect>=0.6.4",
    "opencv-python>=4.9,<5",
    "librosa>=0.10.2",
    "soundfile>=0.12",
    "numpy>=1.26",
    "pillow>=10.0",
    "requests>=2.31",
]

[project.optional-dependencies]
# CUDA 12 runtime libraries for faster-whisper on NVIDIA GPUs (Windows/Linux).
gpu = [
    "nvidia-cublas-cu12>=12.4,<12.9",
    "nvidia-cudnn-cu12>=9,<10",
]

[project.scripts]
aes = "aes.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aes"]

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width={{W}}, height={{H}}" />
    <title>{{TITLE}}</title>
    <link rel="stylesheet" href="{{FONTS_CSS}}" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      /* Generated by `aes build` from plan.json + brands/<brand>.json.
         Edit plan.json and rebuild for structural changes. Hand-written work goes ONLY
         between the CUSTOM markers below; it is preserved across rebuilds. */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: {{W}}px; height: {{H}}px; overflow: hidden; background: {{GROUND}}; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: {{GROUND}}; }
      video { width: 100%; height: 100%; object-fit: cover; transform-origin: 50% 50%; }
      .hold { width: 100%; height: 100%; object-fit: cover; }
      .layer { position: absolute; inset: 0; pointer-events: none; }
      .cap {
        position: absolute; left: 60px; right: 60px; text-align: center;
        font-family: {{CAP_FONT}}; font-weight: {{CAP_WEIGHT}}; font-size: {{CAP_SIZE}}px;
        line-height: 1.05; letter-spacing: -0.01em; color: {{INK}};
        text-transform: {{CAP_TRANSFORM}}; text-shadow: {{CAP_SHADOW}};
        transform-origin: 50% 60%;
      }
      .cap .acc { {{ACCENT_CSS}} }
      .kin {
        position: absolute; left: 50px; right: 50px; text-align: center;
        font-family: {{KIN_FONT}}; font-weight: {{KIN_WEIGHT}}; font-size: {{KIN_SIZE}}px;
        line-height: 0.95; color: {{INK}}; text-shadow: 0 3px 10px rgba(0,0,0,.45); {{KIN_EXTRA}}
      }
      .flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
      /* CUSTOM-CSS-START */
{{CUSTOM_CSS}}
      /* CUSTOM-CSS-END */
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{DURATION}}"
         data-width="{{W}}" data-height="{{H}}" data-fps="{{FPS}}">
      {{VIDEOS}}
      <div id="overlays" class="layer">
        {{OVERLAYS}}
        <!-- CUSTOM-HTML-START -->
{{CUSTOM_HTML}}
        <!-- CUSTOM-HTML-END -->
      </div>
      <div id="captions" class="layer">
        {{CAPTIONS}}
      </div>
      {{AUDIO}}
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      {{JS}}
      // CUSTOM-JS-START
{{CUSTOM_JS}}
      // CUSTOM-JS-END
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
